# Rook NFS-Ganesha（NFSv4.1+）
# 前置：已有 CephFilesystem cephfs（见 10-cephfs.yaml）
# 1) .nfs 是 nfs-controller 要求的固定配置池名，必须通过 CephBlockPool CR 创建
# 2) spec.rados 必须显式声明 pool/namespace，否则 ceph nfs export 命令会报 KeyError: 'rados'
# 3) 导出（export）不属于 CRD，需要单独用 CLI 创建：
#    kubectl -n rook-ceph exec deploy/rook-ceph-tools -- \
#      ceph nfs export create cephfs my-nfs /share cephfs
#    客户端挂载：mount -t nfs4 -o proto=tcp <svc-ip>:/share <dir>
#    内部 Service：rook-ceph-nfs-my-nfs-a（ClusterIP，2049/TCP）
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-nfs
  namespace: rook-ceph
spec:
  name: .nfs
  failureDomain: host
  replicated:
    size: 2
  parameters:
    target_size_ratio: "0.01"
---
apiVersion: ceph.rook.io/v1
kind: CephNFS
metadata:
  name: my-nfs
  namespace: rook-ceph
spec:
  rados:
    pool: .nfs
    namespace: nfs
  server:
    active: 1
