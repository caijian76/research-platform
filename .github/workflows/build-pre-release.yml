name: build-pre-release

# 预发布镜像：不产出 latest，只产出可追溯的预发布标签。
#   push 到 main        -> edge, main, sha-<7位>
#   push 标签 v1.2.3-rc1 -> 1.2.3-rc1, 1.2, sha-<7位>
#   手动触发             -> 自定义标签（默认 edge）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（建议 edge / rc-日期 / rc-版本）'
        required: false
        default: edge
        type: string
      platforms:
        description: '目标平台，逗号分隔'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

concurrency:
  group: build-pre-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/research-platform-backend
  GOPROXY: https://proxy.golang.org,direct
  DEFAULT_PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: 校验（vet + 前端构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端构建检查
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build:
    name: 构建并推送多架构镜像
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # arm64 的运行时阶段要真正执行 apk，需要 QEMU 模拟；
      # 编译阶段用 BUILDPLATFORM 原生执行 + Go 交叉编译，不走模拟。
      - name: 启用 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 预发布不覆盖 latest；将来需要正式发布时改成 auto
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=research-platform-backend
            org.opencontainers.image.description=科研云平台后端（预发布构建）
            org.opencontainers.image.vendor=research-platform

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/backend/Containerfile.multiarch
          platforms: ${{ inputs.platforms || env.DEFAULT_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 传给 Containerfile 的模块代理，避免构建机默认值不合适时无从调整
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关掉 provenance/sbom，保持 manifest 干净（避免出现 unknown/unknown 平台项）
          provenance: false
          sbom: false

      - name: 写入任务摘要
        run: |
          {
            echo "### 预发布镜像已推送"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| 平台 | \`${{ inputs.platforms || env.DEFAULT_PLATFORMS }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "标签："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
